# ============================================================================
# Supabase local development configuration (CLI v2 schema)
# Docs: https://supabase.com/docs/guides/local-development/cli/config
#
# Start local Supabase:   supabase start
# Stop local Supabase:    supabase stop
# Reset local DB:          supabase db reset
# Apply migrations:        supabase db push
# Open local Studio:       http://127.0.0.1:54323
# ============================================================================

project_id = "credorafin"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 15
max_client_conn = 100

[studio]
enabled = true
port = 54323

# v2: [inbucket] was renamed to [local_smtp] (inbucket is now just a warning,
# but local_smtp is the supported section).
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
# v2: refresh_token_rotation_enabled -> enable_refresh_token_rotation
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = true
# v2: policy must be "per_worker" or "oneshot" (was "on_demand")
policy = "per_worker"

[analytics]
enabled = false
