# ============================================================================
# CredoraFin — Nginx HTTP-only config (USE THIS BEFORE running certbot)
# ----------------------------------------------------------------------------
# This is the "pre-HTTPS" config. It serves HTTP on port 80 only and proxies
# to the Next.js production server. Once your DNS is pointed at the server and this
# config is live, run certbot — it will convert this to HTTPS automatically.
#
# INSTALL on EC2:
#   sudo cp nginx/credorafin.com.http.conf /etc/nginx/sites-available/credorafin.com
#   sudo ln -sf /etc/nginx/sites-available/credorafin.com /etc/nginx/sites-enabled/credorafin.com
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo mkdir -p /var/www/html
#   sudo nginx -t && sudo systemctl reload nginx
#
# THEN GET HTTPS:
#   sudo certbot --nginx -d credorafin.com --agree-tos --no-eff-email -m credorafin@gmail.com
#   ↑ certbot will automatically rewrite this file to add the 443 block + redirect
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name credorafin.com www.credorafin.com;

    # Let's Encrypt ACME challenge path (certbot needs this to verify domain)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    # Client body size for file uploads
    client_max_body_size 20M;

    # Next.js dev HMR websocket — must be above / location
    location /_next/webpack-hmr {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Main reverse proxy → Next.js production server
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Static assets caching
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
}
