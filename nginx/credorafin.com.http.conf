# ============================================================================
# CredoraFin — Nginx HTTP-only config (USE THIS BEFORE running certbot)
# ----------------------------------------------------------------------------
# This is the "pre-HTTPS" config. It serves HTTP on port 80 only and proxies
# to the Next.js production server. Once your DNS is pointed at the server and
# this config is live, run certbot — it will convert this to HTTPS automatically.
#
# IMPORTANT — __APP_ROOT__ placeholder:
#   The /_next/static/ and /fonts/ locations serve files DIRECTLY from the
#   filesystem (bypassing the Node.js server) for speed and robustness. The
#   string __APP_ROOT__ is replaced with the absolute project path by
#   deploy.sh when the config is installed to /etc/nginx/sites-available/.
#   Do NOT edit __APP_ROOT__ by hand — always run:  ./deploy.sh --nginx
#
# INSTALL on EC2:
#   sudo cp nginx/credorafin.com.http.conf /etc/nginx/sites-available/credorafin.com
#   sudo ln -sf /etc/nginx/sites-available/credorafin.com /etc/nginx/sites-enabled/credorafin.com
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo mkdir -p /var/www/html
#   sudo nginx -t && sudo systemctl reload nginx
#   ↑ OR just run: ./deploy.sh --nginx  (does all of the above + path substitution)
#
# THEN GET HTTPS:
#   sudo certbot --nginx -d credorafin.com --agree-tos --no-eff-email -m credorafin@gmail.com
#   ↑ certbot will automatically rewrite this file to add the 443 block + redirect
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name credorafin.com www.credorafin.com;

    # Let's Encrypt ACME challenge path (certbot needs this to verify domain)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    # Client body size for file uploads
    client_max_body_size 20M;

    # ── Next.js static assets — served DIRECTLY from filesystem ─────────────
    # This is the #1 performance + reliability win for Next.js production.
    # CSS chunks, JS chunks, and font files are served by nginx without
    # hitting the Node.js server at all. Even if the app server is restarting
    # or under heavy load, static assets load instantly.
    #
    # This also eliminates the class of 500 errors where the standalone
    # server.js can't find chunks at the expected path.
    location /_next/static/ {
        alias __APP_ROOT__/.next/standalone/.next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
        try_files $uri =404;
    }

    # ── Public static assets (logo, images, fonts) — direct from filesystem ─
    # /fonts/RupeeSymbol.woff2, /logo.svg, /images/*, /og/*, /uploads/*
    location /fonts/ {
        alias __APP_ROOT__/.next/standalone/public/fonts/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }
    location /images/ {
        alias __APP_ROOT__/.next/standalone/public/images/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }
    location /og/ {
        alias __APP_ROOT__/.next/standalone/public/og/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }
    # ── User-uploaded files (admin uploads) — served from the SOURCE public/
    #    dir, NOT .next/standalone/public/. The Next.js app writes uploads to
    #    process.cwd()/public/uploads/ (the project root), so nginx must serve
    #    from there too. Using .next/standalone/public/uploads/ would cause a
    #    mismatch — uploads succeed but the files 404 when the browser
    #    requests them. This path is persistent across rebuilds.
    location /uploads/ {
        alias __APP_ROOT__/public/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }
    location = /logo.svg {
        alias __APP_ROOT__/.next/standalone/public/logo.svg;
        expires 30d;
        access_log off;
    }

    # ── Next.js dev HMR websocket — must be above / location ────────────────
    # (Only used in dev; harmless in production.)
    location /_next/webpack-hmr {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Main reverse proxy → Next.js production server ──────────────────────
    # Handles all dynamic requests: pages, API routes, /_next/data/, etc.
    # Static assets are handled by the location blocks above and never reach
    # this proxy. Must use HTTP/1.1 for chunked transfer-encoding support.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
