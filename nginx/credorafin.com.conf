# ============================================================================
# CredoraFin — Nginx reverse proxy config for credorafin.com (HTTP + HTTPS)
# ----------------------------------------------------------------------------
# Proxies dynamic traffic to the Next.js production server on 127.0.0.1:3000.
# Static assets (/_next/static/, /fonts/, /images/, etc.) are served DIRECTLY
# from the filesystem by nginx — faster and more robust than proxying them.
#
# Handles both HTTP (port 80, for certbot challenges + redirect) and
# HTTPS (port 443, real traffic) once a Let's Encrypt cert is installed.
#
# IMPORTANT — __APP_ROOT__ placeholder:
#   The string __APP_ROOT__ is replaced with the absolute project path by
#   deploy.sh when the config is installed. Do NOT edit by hand — run:
#   ./deploy.sh --nginx
#
# INSTALL on EC2:
#   sudo cp nginx/credorafin.com.conf /etc/nginx/sites-available/credorafin.com
#   sudo ln -sf /etc/nginx/sites-available/credorafin.com /etc/nginx/sites-enabled/credorafin.com
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   ↑ OR just run: ./deploy.sh --nginx  (does all of the above + path substitution)
#
# GET HTTPS (run AFTER the config above is live and DNS points here):
#   sudo certbot --nginx -d credorafin.com --agree-tos --no-eff-email -m credorafin@gmail.com
#   ↑ certbot will auto-edit this file to fill in the ssl_certificate lines
#     and add the 80 → 443 redirect.
# ============================================================================

# ── HTTP (port 80) ──────────────────────────────────────────────────────────
# Serves Let's Encrypt ACME challenges on /.well-known/acme-challenge/ so
# certbot can verify domain ownership. Everything else redirects to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name credorafin.com www.credorafin.com;

    # Let's Encrypt ACME challenge path — must be served over HTTP, not redirected
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS (port 443) ────────────────────────────────────────────────────────
# Reverse proxy to the Next.js production server. The ssl_certificate lines are
# filled in by `certbot --nginx` automatically.
server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name credorafin.com www.credorafin.com;

    # ── TLS certificate (filled in by certbot --nginx) ──────────────────────
    # ssl_certificate     /etc/letsencrypt/live/credorafin.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/credorafin.com/privkey.pem;

    # ── TLS hardening ───────────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Client body size for file uploads ───────────────────────────────────
    client_max_body_size 20M;

    # ── Next.js static assets — served DIRECTLY from filesystem ─────────────
    # CSS chunks, JS chunks, and font files served by nginx without hitting
    # the Node.js server. Eliminates 500 errors on static assets.
    location /_next/static/ {
        alias __APP_ROOT__/.next/standalone/.next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
        try_files $uri =404;
    }

    # ── Public static assets — direct from filesystem ───────────────────────
    location /fonts/ {
        alias __APP_ROOT__/.next/standalone/public/fonts/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }
    location /images/ {
        alias __APP_ROOT__/.next/standalone/public/images/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }
    location /og/ {
        alias __APP_ROOT__/.next/standalone/public/og/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }
    # ── User-uploaded files (admin uploads) — served from the SOURCE public/
    #    dir, NOT .next/standalone/public/. The Next.js app writes uploads to
    #    process.cwd()/public/uploads/ (the project root), so nginx must serve
    #    from there too. Using .next/standalone/public/uploads/ would cause a
    #    mismatch — uploads succeed but the files 404 when the browser
    #    requests them. This path is persistent across rebuilds.
    location /uploads/ {
        alias __APP_ROOT__/public/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }
    location = /logo.svg {
        alias __APP_ROOT__/.next/standalone/public/logo.svg;
        expires 30d;
        access_log off;
    }

    # ── Next.js dev HMR websocket (dev only; harmless in prod) ──────────────
    location /_next/webpack-hmr {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Main reverse proxy → Next.js production server ──────────────────────
    # Handles all dynamic requests: pages, API routes, /_next/data/, etc.
    # Static assets are handled by the location blocks above and never reach
    # this proxy. Must use HTTP/1.1 for chunked transfer-encoding support.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # CRITICAL: Never cache HTML pages. Without this, nginx or upstream
        # proxies may cache old page content, causing text changes to not
        # reflect after a deploy even though the build is fresh.
        # 'no-store' = never cache, 'must-revalidate' = always check with origin
        # This is the #1 fix for ChunkLoadError after deploys: if HTML is
        # cached, browsers keep referencing old chunk hashes that no longer
        # exist on the server → 404 → ChunkLoadError → broken white page.
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Deploy-Version "$date_gmt" always;
    }
}
