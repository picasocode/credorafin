# ============================================================================
# CredoraFin — Nginx reverse proxy config for credorafin.com
# ----------------------------------------------------------------------------
# Proxies all traffic to the Next.js production server on 127.0.0.1:3000.
# Handles both HTTP (port 80, for certbot challenges + redirect) and
# HTTPS (port 443, real traffic) once a Let's Encrypt cert is installed.
#
# INSTALL on EC2:
#   sudo cp nginx/credorafin.com.conf /etc/nginx/sites-available/credorafin.com
#   sudo ln -sf /etc/nginx/sites-available/credorafin.com /etc/nginx/sites-enabled/credorafin.com
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# GET HTTPS (run AFTER the config above is live and DNS points here):
#   sudo certbot --nginx -d credorafin.com --agree-tos --no-eff-email -m credorafin@gmail.com
#   ↑ certbot will auto-edit this file to fill in the ssl_certificate lines
#     and add the 80 → 443 redirect. You don't need to hand-edit for HTTPS.
#
# If you want to hand-edit the SSL paths after certbot issues a cert,
# fill in the two ssl_certificate lines in the HTTPS block below.
# ============================================================================

# ── HTTP (port 80) ──────────────────────────────────────────────────────────
# Serves Let's Encrypt ACME challenges on /.well-known/acme-challenge/ so
# certbot can verify domain ownership. Everything else redirects to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name credorafin.com www.credorafin.com;

    # Let's Encrypt ACME challenge path — must be served over HTTP, not redirected
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        # certbot places challenge files here; serve them as static files
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS (safe even before cert exists —
    # if 443 isn't up yet, the redirect just loops back to 80 which hits the
    # acme-challenge location above, but browsers will show a cert warning.
    # Once certbot runs, this redirect is what enforces HTTPS for users.)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS (port 443) ────────────────────────────────────────────────────────
# Reverse proxy to the Next.js production server. The ssl_certificate lines are
# filled in by `certbot --nginx` automatically; if you're hand-editing after
# certbot ran, the paths are usually:
#   /etc/letsencrypt/live/credorafin.com/fullchain.pem
#   /etc/letsencrypt/live/credorafin.com/privkey.pem
server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name credorafin.com www.credorafin.com;

    # ── TLS certificate (filled in by certbot --nginx) ──────────────────────
    # Uncomment + fill these AFTER certbot has issued a cert, OR just run
    # `certbot --nginx -d credorafin.com` and let it manage these lines.
    # ssl_certificate     /etc/letsencrypt/live/credorafin.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/credorafin.com/privkey.pem;

    # ── TLS hardening ───────────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # HSTS: tell browsers to use HTTPS for this domain for 1 year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Client body size for file uploads (brochures, resumes) ──────────────
    client_max_body_size 20M;

    # ── Next.js dev HMR websocket (/_next/webpack-hmr) ──────────────────────
    # Must be above the / location so it's matched first. Dev server uses
    # websockets for hot module replacement; without this, HMR silently fails.
    location /_next/webpack-hmr {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Main reverse proxy → Next.js production server ─────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support (HMR, socket.io, etc.)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward original request info so the app sees real client data
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts — dev server compiles routes on-demand on first hit, so
        # the first request to each route can take 5-30s. Be generous.
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Static assets (Next.js /_next/static is immutable, cache hard) ──────
    # In dev mode these are served by the dev server, so we just proxy and
    # add cache headers. In production you'd point this at the static dir.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
}
